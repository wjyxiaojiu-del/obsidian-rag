services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - /f/小九/小九的obisidian:/vault:ro
    env_file:
      - ./backend/.env
    environment:
      - OBSIDIAN_VAULT_PATH=/vault
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
